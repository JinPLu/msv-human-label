<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>多镜评测人评台</title>
<style>

:root{

html,body{height:100%}
body{margin:0;background:var(--surround);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.55;

.tabs{display:flex;gap:8px;flex-wrap:wrap}

.tabs button b{font-size:16px;color:var(--ink)}
.tabs button span{font-family:var(--font-mono);font-size:12px}
.tabs button.here{border-color:var(--focus);box-shadow:inset 0 0 0 1px var(--focus)}
.tabs button.full span{color:var(--yes)}

.ask .ent{color:var(--ink-dim);margin:0} .ask .ent b{color:var(--ink);font-weight:500}

.pick{display:flex;flex-direction:column;gap:12px;max-width:62ch}.pick[hidden]{display:none}.pick h2{font-size:24px;margin:0}
body.picking .tabs,body.picking .reel,body.picking .stage,body.picking #deck,body.picking .rule{display:none}
.done{display:none;flex:1;flex-direction:column;justify-content:center;gap:12px;max-width:62ch}
.done h2{font-size:26px;margin:0}
body.finished .stage,body.finished .deck{display:none} body.finished .done{display:flex}
</style></head><body>
<header class="slate"><h1>多镜评测人评台</h1><span class="tag" id="pos"></span><span class="tag" id="whotag"></span><span class="save" id="load"></span><span class="save" id="save" style="margin-left:0">正在连接保存…</span><button class="io" id="export">导出标签</button><label class="io" for="importf">导入标签</label><input type="file" id="importf" accept="application/json" hidden></header>
<section class="pick" id="pick" hidden><h2>你是哪一位标注人？</h2><p>两人各标一半，另有一小部分两人都标。选定后会记在这个浏览器里，链接里也会带上。</p><div class="deck"><button class="key k1" data-who="A"><kbd>A</kbd><span class="t"><b>标注人 A</b><span>按约定的分工</span></span></button><button class="key k2" data-who="B"><kbd>B</kbd><span class="t"><b>标注人 B</b><span>按约定的分工</span></span></button></div></section>
<nav class="tabs" id="tabs" aria-label="六组题"></nav>
<nav class="reel" id="reel" aria-label="本组进度，点一格跳到那一题"></nav>
<main class="stage" id="stage" aria-live="polite"></main>
<section class="done" id="done"><h2>六组都标完了</h2><p id="donecount"></p>
<p>本机服务模式下标签已存进运行目录的 labels/labels-&lt;标注人&gt;.json；网页模式下请点右上「导出标签」，把下载的 JSON 文件发回来。要改哪一题，点上方那一组和进度条那一格，或按 <kbd>←</kbd> 回去重标。</p></section>
<footer class="deck" id="deck">
  <button class="key k1" id="k1"><kbd>1</kbd><span class="t"><b></b><span></span></span></button>
  <button class="key k2" id="k2"><kbd>2</kbd><span class="t"><b></b><span></span></span></button>
  <button class="key k3" id="k3"><kbd>3</kbd><span class="t"><b>看不清</b><span>画面全黑、太糊，或找不到题里的人、物、地方</span></span></button>
</footer>
<div class="rule"><p id="rule"></p><p>按 <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 打标并跳到下一题 · <kbd>空格</kbd> 片段重播 · <kbd>←</kbd><kbd>→</kbd> 前后翻 · <kbd>[</kbd><kbd>]</kbd> 换组 · <kbd>⌫</kbd> 清除本题</p></div>
<script>
const DATA_FILE = "data-4ede13502d.json", REV = "5474e40ea801faf16b19fe5ad9984d04f8606d0c", REPO = "JinPLu/msv-human-label";
let ITEMS = [], PACKS = {};
// 取数来源：本机服务只用本机；网页版在 jsDelivr 几个镜像与 GitHub Pages 之间先用 64 KB 探针赛跑，按先到先用排序，失败或卡住就换下一个。
const LOCAL = ["127.0.0.1", "localhost"].includes(location.hostname);
const MIRRORS = LOCAL || !REV.match(/^[0-9a-f]{7,40}$/) ? [] : ["gcore", "testingcf", "cdn", "fastly"].map(h => `https://${h}.jsdelivr.net/gh/${REPO}@${REV}/`);
let BASES = [...MIRRORS, ""];
const baseName = b => b ? b.split("/")[2].split(".")[0] + " · jsDelivr" : (LOCAL ? "本机" : "GitHub Pages");
async function raceBases(){
  if (BASES.length === 1) return;
  const t0 = performance.now(), done = [];
  await Promise.race([
    Promise.allSettled(BASES.map(b => fetch(b + "probe.bin", {cache: "no-store"}).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); }).then(() => done.push(b)))),
    new Promise(r => setTimeout(r, 8000))]);

}

async function boot(){

}
const SAME = {keys:[["是同一个","看得出是同一个"],["不是同一个","看得出换了"]]};
const GROUPS = {
  character:{name:"人物",look:"镜头 A 与镜头 B 里的这个人是不是同一个人",...SAME,
    rule:"上一行是镜头 A 的首、中、末帧，下一行是镜头 B 的。比脸、发型、体型；只有脸看不到时才用衣着。衣服一样但脸换了，算不是同一个。题里的人在任一镜头里找不到，按看不清。"},
  object:{name:"物体",look:"两个镜头里的这件东西是不是同一件",...SAME,
    rule:"比具体这件东西本身（形状、颜色、花纹、标志），不是同一类就算。东西在任一镜头里找不到，按看不清。"},
  scene:{name:"场景",look:"两个镜头是不是同一个具体地方",...SAME,
    rule:"比墙、门窗、家具、建筑这类固定结构，机位不同也可以是同一个地方；只是同一类地方（都是厨房）不算。"},
  event:{name:"事件",look:"这一镜里，题里说的动作有没有真的发生",keys:[["发生了","在这一镜里看得到动作做出来"],["没发生","没做、只摆姿势、做到一半，或只看到结果"]],
    rule:"只看这一镜。动作要在画面里做出来才算；开镜就已经是结果、只做到一半，都算没发生。谁做的不管：换了脸由人物题扣分。可以按空格重播，也可以看下面每秒 4 帧的帧条。"},
  state:{name:"状态",look:"这一镜里，题里说的状态是否成立",keys:[["成立","题里说的状态在这一镜里看得到"],["不成立","没有这个状态，或看不出来"]],
    rule:"带绿框的帧条是这一镜最后约 1 秒：问的是这一镜结束时的样子。右边有参考图的是回访题：参考图是之前发生变化那一镜的末帧，只用来认出是哪个人、哪件东西，判断只看这一镜。"},
  setup:{name:"机位",look:"镜头 B 是不是换了一个新机位",keys:[["新机位","相机明显挪动、转向或推拉，固定背景的位置或大小变了，或换了地方"],["同机位或没切开","固定背景基本在原位、原大小；或两镜之间根本没切"]],
    rule:"只看墙、门窗、建筑、地平线这类固定结构在画面里的位置和大小。人走近走远、换了个人、小物件或光线变化都不算新机位；轻微摇摄或小幅改构图也算同机位。下面若有片段，是切点前后各 1 秒，用来看是不是真的切了。"},
};
const GORDER = ["character","object","scene","event","state","setup"];
const LS0 = "human-alignment-v13-20261111";
let labels = {}, group = "character", idx = 0, server = false, WHO = null, LS = LS0;
let ALL = [];
const $ = id => document.getElementById(id);
const inG = g => ITEMS.filter(it => it.g === g);
function pickWho(){
  const u = new URLSearchParams(location.search).get("who");
  let w = (u || "").toUpperCase();
  if (!["A","B"].includes(w)) { try { w = localStorage.getItem(LS0 + "-who") || ""; } catch(e){} }
  return ["A","B"].includes(w) ? w : null;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const URLS = {}, READY = {}, LOAD = {};
const M = (k, s) => URLS[k + s] || "";
const CACHE = "msv-human-label-packs";
// 媒体按「标注人 × 组」打成一个包：一次请求、边收边用；收完存进 Cache Storage，下次打开直接从本地读。
function publish(g, buf, got){
  const P = PACKS[WHO][g]; let fresh = false;
  for (const [tag, end] of Object.entries(P.ends)){
    if (READY[tag] || end > got) continue;

    for (const [name, [off, len, mime]] of Object.entries(P.files))
      if (!URLS[name] && (name.startsWith(it.k + "_") || name === it.k + ".mp4")) URLS[name] = URL.createObjectURL(new Blob([buf.slice(off, off + len)], {type: mime}));

}
function loadText(){
  const gs = Object.keys(PACKS[WHO] || {}); const done = gs.filter(g => LOAD[g] && LOAD[g].done).length;
  const got = gs.reduce((a, g) => a + (LOAD[g] ? LOAD[g].got : 0), 0), size = gs.reduce((a, g) => a + PACKS[WHO][g].size, 0);

}
function showLoad(){ $("load").textContent = loadText(); const w = document.querySelector(".waiting b"); if (w && LOAD[group]) w.textContent = `${(LOAD[group].got/1e6).toFixed(1)} / ${(PACKS[WHO][group].size/1e6).toFixed(1)} MB`; }
async function loadPack(g){
  if (LOAD[g]) return LOAD[g].p;
  const P = PACKS[WHO][g]; LOAD[g] = {got: 0, done: false};
  LOAD[g].p = (async () => {
    const KEY = new Request(location.origin + "/__packs/" + P.url.split("/").pop());
    try { const c = await caches.open(CACHE); const hit = await c.match(KEY);
      if (hit){ const buf = new Uint8Array(await hit.arrayBuffer()); if (buf.length === P.size){ LOAD[g].got = P.size; publish(g, buf, P.size); LOAD[g].done = true; showLoad(); return; } } } catch(e){}
    for (let attempt = 0; attempt < 3; attempt++){
      try {
        await fetchFrom(P.url, async (r, alive, b) => {
          LOAD[g].src = baseName(b);
          const reader = r.body.getReader(), buf = new Uint8Array(P.size); let got = 0, last = 0;
          for (;;){ const {done, value} = await reader.read(); if (done) break; alive(); buf.set(value, got); got += value.length; LOAD[g].got = got;
            if (got - last > 150000 || got === P.size){ last = got; publish(g, buf, got); showLoad(); } }
          if (got !== P.size) throw new Error("short");
          publish(g, buf, got); LOAD[g].done = true; showLoad();
          try { const c = await caches.open(CACHE); await c.put(KEY, new Response(buf)); } catch(e){}
        });
        return;
      } catch(e){ LOAD[g].got = 0; await new Promise(r => setTimeout(r, 2000 * (attempt + 1))); }

}
async function loadAll(first){
  const order = [first, ...GORDER.filter(g => g !== first)];
  for (const g of order) await loadPack(g);
}
function loadLocal(){ try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch(e){ return {}; } }
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(labels)); } catch(e){} }
async function init(){
  try { await boot(); } catch(e){ $("load").textContent = "题目数据载入失败，请刷新页面重试"; return; }
  WHO = pickWho();
  if (!WHO){
    document.body.classList.add("picking"); $("pick").hidden = false;
    $("pick").querySelectorAll("button").forEach(b => b.onclick = () => {
      try { localStorage.setItem(LS0 + "-who", b.dataset.who); } catch(e){}
      const u = new URL(location.href); u.searchParams.set("who", b.dataset.who); location.href = u.toString(); });
    return;
  }

async function put(tag, label){

function tabs(){

function reel(){
  const a = inG(group);

}
function frames(k, names, cls){
  return `<div class="frames ${cls||''}">` + names.map((n, i) => `<figure><img src="${M(k, `_f${i}`)}" alt="${esc(n)}"><figcaption>${esc(n)}</figcaption></figure>`).join("") + `</div>`;
}
function stage(it){
  const G = GROUPS[it.g];

  if (it.ents) h += it.ents.map(([e, d]) => `<p class="ent"><b>${esc(e)}</b>：${esc(d)}</p>`).join("");
  h += `</div>`;
  if (["character","object","scene"].includes(it.g)){
    h += `<div class="rowlab">镜头 A</div>` + frames(it.k, ["A 首帧","A 中帧","A 末帧"]);
    h += `<div class="rowlab">镜头 B</div>` + `<div class="frames">` + [3,4,5].map((n, i) => `<figure><img src="${M(it.k, `_f${n}`)}" alt=""><figcaption>${["B 首帧","B 中帧","B 末帧"][i]}</figcaption></figure>`).join("") + `</div>`;
  } else if (it.g === "setup"){
    h += `<div class="frames two">` + ["A 首帧","A 末帧","B 首帧","B 末帧"].map((n, i) => `<figure><img src="${M(it.k, `_f${i}`)}" alt=""><figcaption>${n}</figcaption></figure>`).join("") + `</div>`;
    if (it.adj) h += `<div class="rowlab">切点前后各 1 秒</div><div class="screen"><video id="vid" src="${M(it.k, '.mp4')}" autoplay muted loop playsinline controls></video></div>`;
  } else {
    h += `<div class="screen"><video id="vid" src="${M(it.k, '.mp4')}" autoplay muted loop playsinline controls></video>`;
    if (it.ref) h += `<figure style="margin:0"><img class="ref" src="${M(it.k, '_f0')}" alt="参考"><figcaption>参考：变化那一镜的末帧</figcaption></figure>`;
    h += `</div><div class="strip">`;
    for (let i = 0; i < it.n; i++){
      const tail = it.end && i >= it.n - 4;
      h += `<div class="f ${tail?'tail':''}" style="background-image:url('${M(it.k, '_strip')}');background-size:${it.n*100}% 100%;background-position:${it.n>1? (i/(it.n-1))*100 : 0}% 0"></div>`;
    }
    h += `</div>`;
  }
  return h;
}
function render(){
  const a = inG(group);
  const allDone = ITEMS.every(it => labels[it.tag]);
  tabs(); reel();
  if (!a.length) return;
  idx = Math.min(Math.max(idx, 0), a.length - 1);
  const it = a[idx], G = GROUPS[group];
  $("pos").textContent = `${it.tag} · ${idx + 1} / ${a.length}`;
  if (!READY[it.tag]){ loadPack(group); $("stage").innerHTML = `<div class="waiting">正在载入这一组的画面… <b></b></div>`; showLoad(); }
  else $("stage").innerHTML = stage(it);
  [1,2].forEach(n => { const [b, s] = G.keys[n-1]; $("k"+n).querySelector("b").textContent = b; $("k"+n).querySelector(".t span").textContent = s; });
  [1,2,3].forEach(n => $("k"+n).classList.toggle("on", labels[it.tag] && labels[it.tag].label === String(n)));
  $("rule").textContent = G.rule;
  document.body.classList.toggle("finished", allDone && group === "done");
  $("donecount").textContent = `共 ${ITEMS.length} 题，全部有标签。`;
}
function next(){
  const a = inG(group);
  const later = a.findIndex((it, i) => i > idx && !labels[it.tag]);
  if (later >= 0){ idx = later; return render(); }
  const g = GORDER.find(g => inG(g).some(it => !labels[it.tag]));
  if (g){ group = g; idx = inG(g).findIndex(it => !labels[it.tag]); return render(); }
  group = "done"; tabs(); document.body.classList.add("finished");
}
async function mark(n){
  if (group === "done") return;
  const it = inG(group)[idx]; await put(it.tag, String(n)); next();
}
[1,2,3].forEach(n => $("k"+n).onclick = () => mark(n));
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (["1","2","3"].includes(e.key)){ e.preventDefault(); mark(+e.key); }
  else if (e.key === "ArrowRight"){ idx++; render(); }
  else if (e.key === "ArrowLeft"){ if (group === "done"){ group = GORDER[GORDER.length-1]; document.body.classList.remove("finished"); idx = inG(group).length - 1; } else idx--; render(); }
  else if (e.key === " "){ const v = $("vid"); if (v){ e.preventDefault(); v.currentTime = 0; v.play(); } }
  else if (e.key === "[" || e.key === "]"){ const i = GORDER.indexOf(group === "done" ? "setup" : group); group = GORDER[(i + (e.key === "]" ? 1 : GORDER.length - 1)) % GORDER.length]; document.body.classList.remove("finished"); idx = Math.max(0, inG(group).findIndex(it => !labels[it.tag])); render(); }
  else if (e.key === "Backspace"){ e.preventDefault(); const it = inG(group)[idx]; if (it){ put(it.tag, null).then(render); } }
});
$("export").onclick = () => {
  const blob = new Blob([JSON.stringify({who: WHO, exported_at: new Date().toISOString(), labels}, null, 1)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `labels-${WHO}.json`; document.body.appendChild(a); a.click(); a.remove();
};
$("importf").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); const got = d.labels || d;
    for (const [t, v] of Object.entries(got)) if (ITEMS.some(it => it.tag === t)) { labels[t] = v; if (server) await fetch("api/labels", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({who: WHO, tag: t, label: v.label, at: v.at})}); }
    saveLocal(); render(); } catch(err){ $("save").textContent = "导入失败：文件不是导出的标签"; }
};
init();
</script>
</body></html>
